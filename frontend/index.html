<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>InterviewSense — Ace Every Interview with AI</title>
    <meta name="description" content="AI-powered mock interviews with real-time voice analysis, personalized feedback, and detailed performance reports to help you ace your dream job interview." />

    <!-- Favicon & Theme Color -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0A0A0F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://interviewsense-ai-tau.vercel.app/" />
    <meta property="og:site_name" content="InterviewSense" />
    <meta property="og:title" content="InterviewSense — Ace Every Interview with AI" />
    <meta property="og:description" content="AI-powered mock interviews with real-time voice analysis, personalized feedback, and detailed performance reports to help you ace your dream job interview." />
    <meta property="og:image" content="https://interviewsense-ai-tau.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="InterviewSense — Ace Every Interview with Real-Time AI Coaching" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InterviewSense — Ace Every Interview with AI" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme') || localStorage.getItem('interviewsense-theme');
          var root = document.documentElement;
          if (saved === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.colorScheme = 'light';
          } else {
            root.classList.remove('light');
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div style="font-family: system-ui, -apple-system, sans-serif; padding: 2.5rem 1.5rem; text-align: center; background: #0A0A0F; color: #F8F8FF; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.75rem; letter-spacing: -0.02em;">InterviewSense</h1>
        <p style="color: #94A3B8; max-width: 480px; margin: 0 auto; line-height: 1.6; font-size: 0.95rem;">
          InterviewSense is an interactive platform for realistic technical and HR mock interviews with real-time voice transcription and AI coaching. Please enable JavaScript to access all features.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
